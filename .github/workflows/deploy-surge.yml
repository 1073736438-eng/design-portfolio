name: Deploy to Surge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: surge-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Surge
        run: npm ci

      - name: Deploy
        run: npx surge . https://sssy-portfolio.surge.sh
        env:
          SURGE_LOGIN: 1073736438@qq.com
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
